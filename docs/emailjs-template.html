<!-- EmailJS template body. Subject line in EmailJS: New project request from {{from_name}} -->
<div style="margin:0;padding:24px;background:#f3f5fb;font-family:Arial,Helvetica,sans-serif;color:#1d2a5a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;">
    <tr>
      <td style="background:#1238d6;padding:24px 28px;">
        <p style="margin:0;color:#ccff3d;font-size:12px;letter-spacing:2px;text-transform:uppercase;">New project request</p>
        <h1 style="margin:8px 0 0;color:#f6f8ff;font-size:24px;line-height:1.2;">{{from_name}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px 8px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="font-size:15px;line-height:1.5;">
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;color:#6b7597;width:130px;">Name</td>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;font-weight:bold;">{{from_name}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;color:#6b7597;">Email</td>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;"><a href="mailto:{{reply_to}}" style="color:#1238d6;">{{reply_to}}</a></td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;color:#6b7597;">Company</td>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;">{{company}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;color:#6b7597;">Budget</td>
            <td style="padding:10px 0;border-bottom:1px solid #e6e9f5;">{{budget}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px 28px;">
        <p style="margin:0 0 8px;color:#6b7597;font-size:13px;text-transform:uppercase;letter-spacing:1px;">Project details</p>
        <div style="background:#f3f5fb;border-radius:12px;padding:16px 18px;font-size:15px;line-height:1.6;white-space:pre-line;">{{message}}</div>
        <p style="margin:22px 0 0;">
          <a href="mailto:{{reply_to}}?subject=Re: your project request" style="display:inline-block;background:#ccff3d;color:#1238d6;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:999px;">Reply to {{from_name}}</a>
        </p>
      </td>
    </tr>
  </table>
  <p style="max-width:600px;margin:14px auto 0;text-align:center;color:#8a93b3;font-size:12px;">Sent from osamasharaf.dev</p>
</div>
